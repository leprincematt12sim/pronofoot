<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PronoFoot PRO</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <audio id="siteAudioPlayer"></audio>

  <!-- AUTHENTIFICATION -->
  <div class="auth-overlay" id="authScreen" style="display:none">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:20px">
        <h1 style="font-size:2.5rem;color:var(--text-main)">Prono<span style="color:var(--accent)">Foot</span></h1>
        <p data-i18n="auth_sub" style="color:var(--text-muted);font-size:0.85rem;text-transform:uppercase;font-weight:bold;margin-top:5px">Saison 2026-27</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group"><label data-i18n="email">Email / Pseudo</label><input type="text" id="loginEmail" required></div>
        <div class="form-group"><label data-i18n="password">Mot de passe</label><input type="password" id="loginPass" required></div>
        <button type="submit" class="btn btn-primary" style="width:100%" data-i18n="btn_login_submit">Se connecter</button>
        <button type="button" class="btn btn-secondary" style="width:100%;margin-top:10px" onclick="quickAdminLogin()">⭐ Connexion ADMIN</button>
      </form>
    </div>
  </div>

  <div id="appContainer">
    <nav class="top-nav">
      <div class="nav-brand" onclick="navigateTo('dashboard')">Prono<span>Foot</span></div>
      <div style="display:flex;align-items:center;gap:15px">
        <div class="lang-selector">
          <span onclick="setLanguage('fr')">🇫🇷</span>
          <span onclick="setLanguage('en')">🇬🇧</span>
          <span onclick="setLanguage('de')">🇩🇪</span>
        </div>
        <div class="nav-points" id="navPoints">0 pts</div>
      </div>
    </nav>

    <nav class="bottom-nav">
      <button class="bottom-nav-item active" onclick="navigateTo('dashboard')"><span>🏠</span><span data-i18n="nav_home">Accueil</span></button>
      <button class="bottom-nav-item" onclick="navigateTo('matches')"><span>⚽</span><span data-i18n="nav_matches">Matchs</span></button>
      <button class="bottom-nav-item" onclick="navigateTo('leaderboard')"><span>🏆</span><span data-i18n="nav_rank">Classement</span></button>
      <button class="bottom-nav-item" onclick="navigateTo('admin')" id="adminNavBtn" style="display:none"><span>⚙️</span><span data-i18n="nav_admin">Admin</span></button>
    </nav>

    <div class="main-content">
      <!-- DASHBOARD -->
      <div class="page-section active" id="page-dashboard">
        <h2 style="margin-bottom:20px" data-i18n="welcome">Bienvenue ! 👋</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px">
          <div class="admin-card" style="text-align:center;padding:15px"><div id="statPoints" style="font-size:2rem;font-weight:900;color:var(--accent)">0</div><div style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase">Points</div></div>
          <div class="admin-card" style="text-align:center;padding:15px"><div id="statRank" style="font-size:2rem;font-weight:900;color:var(--gold)">#-</div><div style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase">Rang</div></div>
        </div>
        <button class="btn btn-primary" style="width:100%;padding:15px;margin-bottom:20px" onclick="navigateTo('matches')" data-i18n="btn_predict">⚽ Pronostiquer les matchs</button>
      </div>

      <!-- MATCHS -->
      <div class="page-section" id="page-matches">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
          <h3 class="league-title-special" data-i18n="nav_matches">⚽ Matchs</h3>
          <button class="btn btn-primary btn-sm" onclick="saveAll()" data-i18n="btn_save">💾 Sauvegarder</button>
        </div>
        <div id="matchesContainer"></div>
      </div>

      <!-- CLASSEMENT -->
      <div class="page-section" id="page-leaderboard">
        <h3 class="league-title-special" data-i18n="nav_rank">🏆 Classement Général</h3>
        <div id="leaderboardContainer"></div>
      </div>

      <!-- ADMIN COMPLET (TOUS LES OUTILS) -->
      <div class="page-section" id="page-admin">
        <h3 class="league-title-special">⚙️ Espace Administrateur</h3>

        <div class="admin-card" style="border:1px solid var(--accent)">
          <h4 style="color:var(--accent);margin-bottom:10px">⚡ API Sports (Vrais Scores)</h4>
          <button class="btn btn-gold" style="width:100%" onclick="saveAndSyncApiSports()">🔄 Synchroniser les scores en direct</button>
        </div>

        <div class="admin-card" style="border:1px solid var(--danger)">
          <h4 style="color:var(--danger);margin-bottom:10px">🔴 Testeur LIVE</h4>
          <button class="btn btn-danger" style="width:100%" onclick="adminSimulateLiveMatch()">🔴 Forcer 3 Matchs en LIVE</button>
        </div>

        <div class="admin-card">
          <h4 style="color:var(--gold);margin-bottom:10px">⚽ Saisie Manuelle (+500 matchs)</h4>
          <input type="text" id="adminSearchInput" placeholder="🔍 Rechercher (ex: PSG)..." style="width:100%;padding:10px;margin-bottom:10px;background:#000;color:white;border:1px solid var(--border);border-radius:6px;" oninput="renderAdminMatchList()">
          <div id="adminMatchList" style="max-height:300px;overflow-y:auto;border:1px solid var(--border);padding:10px;border-radius:8px"></div>
        </div>

        <div class="admin-card">
          <h4 style="margin-bottom:10px">🎨 Thème</h4>
          <div style="display:flex;gap:10px">
            <div class="theme-dot" style="background:#00E676" onclick="changeTheme('#00E676')"></div>
            <div class="theme-dot" style="background:#e94560" onclick="changeTheme('#e94560')"></div>
            <div class="theme-dot" style="background:#6c5ce7" onclick="changeTheme('#6c5ce7')"></div>
            <div class="theme-dot" style="background:#FFD700" onclick="changeTheme('#FFD700')"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/matches-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
